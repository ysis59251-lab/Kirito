name: AI Editor

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "สั่ง AI ว่าต้องการแก้อะไร"
        required: true
        type: string

permissions:
  contents: write
  models: read

jobs:
  edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GitHub Models
        run: gh extension install https://github.com/github/gh-models
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare repository context
        env:
          USER_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          instruction = os.environ["USER_INSTRUCTION"]

          files = subprocess.check_output(
              ["git", "ls-files"],
              text=True
          ).splitlines()

          allowed = (
              ".html",
              ".css",
              ".js",
              ".json"
          )

          selected = [
              f for f in files
              if f.lower().endswith(allowed)
              and ".git/" not in f
              and "node_modules/" not in f
          ]

          max_total = 100000
          total = 0

          with open("repository_context.txt", "w", encoding="utf-8") as out:
              out.write("USER REQUEST:\n")
              out.write(instruction)
              out.write("\n\nREPOSITORY FILES:\n")

              for path in selected:
                  try:
                      data = open(
                          path,
                          "r",
                          encoding="utf-8"
                      ).read()
                  except Exception:
                      continue

                  if total + len(data) > max_total:
                      continue

                  out.write(
                      f"\n===== FILE: {path} =====\n"
                  )
                  out.write(data)
                  out.write("\n")

                  total += len(data)

          print(f"Files included: {len(selected)}")
          print(f"Context size: {total}")
          PY

      - name: Ask AI for changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat repository_context.txt | \
          gh models run openai/gpt-4o \
          "You are an expert web developer editing this GitHub repository.

          Read the repository context carefully.

          The user wants:
          ${{ inputs.instruction }}

          IMPORTANT RULES:
          1. Only modify files necessary for the user's request.
          2. Preserve all existing functionality.
          3. Do not modify unrelated parts.
          4. Focus especially on the exact file or feature requested.
          5. Return ONLY a JSON object.
          6. The JSON must have this exact format:

          {
            \"changes\": [
              {
                \"path\": \"relative/path/file.html\",
                \"content\": \"COMPLETE FILE CONTENT\"
              }
            ]
          }

          The content must contain the complete replacement content of every changed file.
          Do not use Markdown fences." \
          > ai_response.txt

      - name: Apply AI changes
        run: |
          python - <<'PY'
          import json
          import re
          import os

          raw = open(
              "ai_response.txt",
              "r",
              encoding="utf-8"
          ).read().strip()

          # เอา Markdown fence ออกถ้า AI เผลอใส่มา
          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          data = json.loads(raw)

          changes = data.get("changes", [])

          if not isinstance(changes, list):
              raise RuntimeError("Invalid AI response")

          if not changes:
              print("AI ไม่ได้ขอแก้ไฟล์")
              raise SystemExit(0)

          for change in changes:
              path = change["path"]
              content = change["content"]

              if (
                  not path
                  or path.startswith("/")
                  or ".." in path.split("/")
              ):
                  raise RuntimeError(
                      f"Unsafe path: {path}"
                  )

              if path.startswith(".github/"):
                  raise RuntimeError(
                      "AI ห้ามแก้ GitHub workflow"
                  )

              os.makedirs(
                  os.path.dirname(path) or ".",
                  exist_ok=True
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(content)

              print(f"Updated: {path}")
          PY

      - name: Show changes
        run: |
          git status --short
          git diff --stat

      - name: Commit changes
        run: |
          git config user.name "AI Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git commit -m "AI: update repository"
          git push