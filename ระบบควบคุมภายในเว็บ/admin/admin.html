<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AnimeFume Admin</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#11182a;--line:#26314b;--text:#f5f7ff;--muted:#9aa6c1;--pink:#ff4d9d;--cyan:#52d9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#20234b 0,#080b16 42%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}.layout{display:flex;min-height:100vh}.sidebar{width:250px;flex:none;padding:18px;background:rgba(12,17,32,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:9px}.brand{font-size:22px;font-weight:800;margin:4px 8px 20px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:4px}.nav{border:0;color:var(--text);background:transparent;text-align:left;padding:13px 14px;border-radius:12px;font:inherit;cursor:pointer}.nav:hover,.nav.active{background:linear-gradient(100deg,rgba(255,77,157,.95),rgba(82,217,255,.92));color:#08101d;font-weight:750}.sidebar-spacer{flex:1}.signout{border:1px solid #493047;background:#1b1222;color:#ff9fc5;padding:11px 13px;border-radius:12px;cursor:pointer;font:inherit}.main{flex:1;min-width:0;padding:24px;overflow:auto}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}.topbar h1{margin:0;font-size:clamp(22px,3vw,32px)}.topbar p{margin:5px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#172039;color:var(--text);padding:11px 14px;border-radius:11px;text-decoration:none;font:inherit;cursor:pointer}.button.primary{border:0;background:linear-gradient(110deg,var(--pink),var(--cyan));color:#07111c;font-weight:750}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat,.card{background:rgba(17,24,42,.9);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}.label{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h2{font-size:17px;margin:0 0 12px}.list{display:grid;gap:8px;max-height:470px;overflow:auto}.row{border-bottom:1px solid rgba(255,255,255,.08);padding:9px 0;font-size:14px}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.empty,.loading{color:var(--muted);padding:12px 0}.toolbar{display:flex;gap:9px;margin-bottom:12px}.toolbar input{flex:1;min-width:0}.input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#0b1120;color:var(--text);font:inherit}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#1c3143;color:#a7eaff;font-size:12px}.danger{color:#ff9b9b}@media(max-width:760px){.layout{display:block}.sidebar{width:auto;position:sticky;top:0;z-index:5;display:flex;flex-direction:row;overflow:auto;padding:9px;border-right:0;border-bottom:1px solid var(--line);gap:6px}.brand{display:none}.nav{white-space:nowrap;padding:10px 12px}.sidebar-spacer{display:none}.signout{white-space:nowrap;padding:9px 12px}.main{padding:16px 12px}.topbar{display:block}.actions{margin-top:14px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:12px 10px}.stat b{font-size:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar"><div class="brand">AnimeFume <small>Admin Console</small></div><button class="nav active" data-page="overview">ภาพรวม</button><button class="nav" data-page="catalog">รายการจาก Sheet</button><button class="nav" data-page="reports">ข้อความแจ้งปัญหา</button><div class="sidebar-spacer"></div><button class="signout" id="signout">ออกจากระบบ</button></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">ภาพรวมระบบ</h1><p id="lastUpdated">กำลังตรวจสอบสิทธิ์…</p></div><div class="actions"><a class="button primary" href="add.html">+ เพิ่มตอน</a><a class="button" href="wo.html">จัดการรูป</a><button class="button" id="refresh">รีเฟรช</button></div></header><section id="overview" class="panel active"><div class="stats"><div class="stat"><span class="label">ผู้ชมออนไลน์</span><b id="onlineCount">0</b></div><div class="stat"><span class="label">รายการใน Sheet1</span><b id="sheet1Count">–</b></div><div class="stat"><span class="label">รายการใน Sheet2</span><b id="sheet2Count">–</b></div></div><div class="grid"><div class="card"><h2>ผู้ชมออนไลน์</h2><div id="onlineList" class="list"><div class="loading">กำลังโหลด…</div></div></div><div class="card"><h2>หน้าที่มีผู้ชมมากที่สุด</h2><div id="pageList" class="list"><div class="loading">กำลังโหลด…</div></div></div></div></section><section id="catalog" class="panel"><div class="card"><h2>รายการจาก Google Sheets</h2><div class="toolbar"><input class="input" id="catalogSearch" placeholder="ค้นหาชื่อเรื่องหรือ ID"><button class="button" id="loadCatalog">โหลดข้อมูล</button></div><div id="catalogList" class="list"><div class="loading">กด “โหลดข้อมูล” เพื่ออ่านข้อมูลล่าสุด</div></div></div></section><section id="reports" class="panel"><div class="card"><h2>ข้อความแจ้งปัญหา</h2><div id="reportList" class="list"><div class="loading">กำลังโหลด…</div></div></div></section></main></div>
<script type="module">
import { requireAdmin, signOut, database } from "../../admin-auth.js";
import { ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import "../../data-source.js";
const $=id=>document.getElementById(id); await requireAdmin("../Administrator.html"); $("lastUpdated").textContent="เชื่อมต่อแล้ว • "+new Date().toLocaleString("th-TH");
const escape=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const showPage=page=>{document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===page));$("pageTitle").textContent=({overview:"ภาพรวมระบบ",catalog:"รายการจาก Sheet",reports:"ข้อความแจ้งปัญหา"})[page]};document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));$("signout").addEventListener("click",async()=>{await signOut();location.replace("../Administrator.html")});
function renderOnline(data={}){const now=Date.now(),pages={},list=[];Object.entries(data).forEach(([id,u])=>{if(!u?.time||now-u.time>15000){remove(ref(database,`onlineUsers/${id}`));return}if(u.role==="admin")return;list.push(`<div class="row">👤 ${escape(id)}<small>📺 ${escape(u.title||"ไม่ทราบชื่อ")} • ${escape(u.page||"-")}</small></div>`);const page=u.page||"ไม่ทราบหน้า";pages[page]=(pages[page]||0)+1});$("onlineCount").textContent=list.length;$("onlineList").innerHTML=list.join("")||'<div class="empty">ยังไม่มีผู้ชมออนไลน์</div>';$ ("pageList").innerHTML=Object.entries(pages).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([p,c])=>`<div class="row">${escape(p)}<small>${c} คน</small></div>`).join("")||'<div class="empty">ยังไม่มีข้อมูล</div>'}
onValue(ref(database,"onlineUsers"),snap=>renderOnline(snap.val()||{}));onValue(ref(database,"reports"),snap=>{const rows=Object.entries(snap.val()||{}).reverse().map(([id,r])=>`<div class="row">${escape(r.detail||"ไม่มีรายละเอียด")}<small>${escape(r.page||"-")} • ${r.time?new Date(r.time).toLocaleString("th-TH"):id}</small></div>`);$("reportList").innerHTML=rows.join("")||'<div class="empty">ยังไม่มีข้อความแจ้งปัญหา</div>'});
let catalog=[];async function loadCatalog(){$("catalogList").innerHTML='<div class="loading">กำลังโหลดข้อมูลจาก Google Sheets…</div>';try{const[one,two]=await Promise.all([window.fetchAnimeFumeSheet("Sheet1"),window.fetchAnimeFumeSheet("Sheet2")]);catalog=[...one.map(x=>({...x,sheet:"Sheet1"})),...two.map(x=>({...x,sheet:"Sheet2"}))];$("sheet1Count").textContent=one.length;$("sheet2Count").textContent=two.length;renderCatalog()}catch(e){$("catalogList").innerHTML=`<div class="empty danger">โหลดข้อมูลไม่สำเร็จ: ${escape(e.message)}</div>`}}function renderCatalog(){const q=$("catalogSearch").value.trim().toLocaleLowerCase("th-TH"),rows=catalog.filter(x=>!q||[x.title,x.name,x.id,x.anime].some(v=>String(v||"").toLocaleLowerCase("th-TH").includes(q))).slice(0,200);$("catalogList").innerHTML=rows.map(x=>`<div class="row"><strong>${escape(x.title||x.name||"ไม่มีชื่อ")}</strong> <span class="badge">${escape(x.sheet)}</span><small>ID: ${escape(x.id||x.anime||"-")} • ตอน: ${escape(x.episode||"-")} • ลิงก์: ${x.link||x.video_url?"มี":"ยังไม่มี"}</small></div>`).join("")||'<div class="empty">ไม่พบรายการ</div>'}$("loadCatalog").addEventListener("click",loadCatalog);$("catalogSearch").addEventListener("input",renderCatalog);$("refresh").addEventListener("click",()=>location.reload());loadCatalog();
</script>
</body></html>
