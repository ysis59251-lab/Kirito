<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Console — AnimeFume</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="./">ANIME<span>FUME</span></a><span class="ghost-link">ADMIN CONSOLE</span></header><main class="shell admin-shell"><section id="login-view"><p class="eyebrow">SECURE ACCESS</p><h1>ศูนย์จัดการ<br><em>คอนเทนต์</em></h1><p class="lead">แอปแอดมินและหน้านี้ใช้ Firestore ฐานข้อมูลเดียวกัน</p><form id="login-form" class="panel form"><label>อีเมล<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button class="button" type="submit">เข้าสู่ระบบ</button><p id="login-error" class="form-error"></p></form></section><section id="dashboard-view" hidden><div class="section-head"><div><p class="eyebrow">CONTENT CONTROL</p><h1>จัดการข้อมูล</h1></div><button id="logout" class="ghost-button">ออกจากระบบ</button></div><div class="admin-grid"><form id="series-form" class="panel form"><h2>เพิ่ม / แก้ไขเรื่อง</h2><input id="series-id" type="hidden"><label>ชื่อเรื่อง<input id="series-title" required></label><label>หมวดหมู่<input id="series-category"></label><label>คำอธิบาย<textarea id="series-description"></textarea></label><label>รูปปก URL<input id="series-cover" type="url"></label><label class="check"><input id="series-published" type="checkbox"> เผยแพร่บนเว็บ</label><div class="form-actions"><button class="button" type="submit">บันทึกเรื่อง</button><button id="series-clear" class="ghost-button" type="button">ล้างฟอร์ม</button></div><p id="series-message" class="form-message"></p></form><form id="episode-form" class="panel form"><h2>เพิ่มตอน</h2><label>เรื่อง<select id="episode-series" required></select></label><label>เลขตอน<input id="episode-number" type="number" min="1" required></label><label>ชื่อตอน<input id="episode-title"></label><label>วิดีโอ URL<input id="episode-video" type="url" required></label><label class="check"><input id="episode-published" type="checkbox"> เผยแพร่ตอนนี้</label><button class="button" type="submit">บันทึกตอน</button><p id="episode-message" class="form-message"></p></form></div><div class="panel"><div class="section-head"><h2>รายการเรื่อง</h2><p id="series-count" class="status"></p></div><div id="series-list" class="admin-list"></div></div></section></main><script type="module" src="src/admin.js"></script></body></html>
