<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>เข้าสู่ระบบแอดมิน</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b1b1b,#0a0a0a);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;padding:18px}
.login-box{background:rgba(30,30,30,.96);width:100%;max-width:420px;padding:30px 24px;border-radius:20px;box-shadow:0 25px 50px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.05)}
h2{text-align:center;margin:0 0 6px;font-size:24px}.warn{text-align:center;font-size:14px;color:#ff8080;margin-bottom:18px}
input{width:100%;padding:16px;margin:10px 0;font-size:16px;border-radius:12px;border:1px solid #333;background:#111;color:#fff}input:focus{outline:none;border-color:#ff4d4d;box-shadow:0 0 0 3px rgba(255,77,77,.25)}
button{width:100%;padding:16px;margin-top:18px;font-size:17px;font-weight:600;border-radius:14px;border:none;color:#fff;background:linear-gradient(135deg,#ff4d4d,#ff1f1f);cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:active{transform:scale(.97)}
#error{text-align:center;font-size:14px;color:#ff4d4d;margin-top:14px;min-height:21px}.hint{text-align:center;color:#888;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="login-box">
  <h2>เข้าสู่ระบบแอดมิน</h2>
  <div class="warn">⚠️ พื้นที่สำหรับผู้ดูแลระบบเท่านั้น</div>
  <form id="loginForm" autocomplete="off">
    <input id="username" name="username" type="email" placeholder="อีเมลผู้ดูแล" autocomplete="username" required>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
  <div class="hint">การเข้าสู่ระบบและสิทธิ์ผู้ดูแลตรวจสอบผ่าน Firebase โดยตรง</div>
</div>
<script type="module">
import { auth, signInAdmin, verifyAdmin } from "../admin-auth.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginBtn");
const error = document.getElementById("error");

const showError = (message) => { error.textContent = message; };
const goToDashboard = () => location.replace("admin/admin.html");

onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    if (await verifyAdmin(user)) goToDashboard();
  } catch (_) {
    // Keep the login form available if the authorization check is unavailable.
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  showError("");
  button.disabled = true;
  button.textContent = "กำลังตรวจสอบ...";
  try {
    await signInAdmin(
      document.getElementById("username").value,
      document.getElementById("password").value
    );
    goToDashboard();
  } catch (err) {
    const messages = {
      "auth/invalid-credential": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
      "auth/invalid-email": "รูปแบบอีเมลไม่ถูกต้อง",
      "auth/too-many-requests": "พยายามเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่",
      "admin/not-authorized": "บัญชีนี้ยังไม่ได้รับสิทธิ์ผู้ดูแลระบบ"
    };
    showError(messages[err.code] || "เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    button.disabled = false;
    button.textContent = "เข้าสู่ระบบ";
  }
});
</script>
</body>
</html>
