name: AnimeFume System Integration

on:
  push:
    branches: [main]
    paths:
      - 'home.html'
      - 'index2.html'
      - 'index3.html'
      - 'search.html'
      - 'history.html'
      - 'sheet2.html'
      - 'folder-name/**'
      - 'animefume-core.js'
      - 'animefume-menu-fix.js'
      - 'player-system.js'
      - 'sheet2-data.js'
      - '.github/scripts/system-integrate.py.txt'
  workflow_dispatch:

concurrency:
  group: kirito-main-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run system integration
        run: python3 .github/scripts/system-integrate.py.txt

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "เชื่อมระบบย่อย AnimeFume ให้ทำงานร่วมกัน"
          git push
