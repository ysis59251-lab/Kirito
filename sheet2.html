<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>AnimeFume • Sheet2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#09090f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;padding:18px}.top{position:sticky;top:0;z-index:5;background:rgba(9,9,15,.92);backdrop-filter:blur(12px);padding:8px 0 14px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none;border:1px solid #333;padding:8px 12px;border-radius:10px}.search{width:100%;margin-top:12px;background:#14141d;color:#fff;border:1px solid #30303d;border-radius:12px;padding:12px 14px;outline:none}.status{font-size:13px;color:#aaa;margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:block;text-decoration:none;color:#fff;background:#11111a;border:1px solid #242432;border-radius:14px;overflow:hidden;min-width:0}.poster{aspect-ratio:2/3;background:#1a1a25;position:relative}.poster img{width:100%;height:100%;display:block;object-fit:cover}.body{padding:9px}.title{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:#aaa;margin-top:5px}.empty{padding:30px 10px;text-align:center;color:#aaa;grid-column:1/-1}@media(min-width:700px){body{max-width:1100px;margin:auto}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top">
  <div class="head"><h1>📚 AnimeFume • Sheet2</h1><a class="back" href="home.html">หน้าแรก</a></div>
  <input id="search" class="search" type="search" placeholder="ค้นหาอนิเมะในข้อมูลที่ฝังในโค้ด..." autocomplete="off">
  <div id="status" class="status">กำลังโหลดข้อมูลจากโค้ด...</div>
</header>
<main id="grid" class="grid"><div class="empty">กำลังโหลด...</div></main>
<script src="sheet2-data.js"></script>
<script>
const grid=document.getElementById('grid');
const status=document.getElementById('status');
const search=document.getElementById('search');
let rows=[];
function norm(v){return String(v??'').trim().toLowerCase();}
function render(){
  const q=norm(search.value);
  const list=rows.filter(r=>!q||norm(r.title).includes(q)||norm(r.id).includes(q)||norm(r.year).includes(q));
  grid.innerHTML='';
  if(!list.length){grid.innerHTML='<div class="empty">ไม่พบรายการ</div>';status.textContent='ไม่พบรายการ';return;}
  const frag=document.createDocumentFragment();
  list.forEach(r=>{
    const a=document.createElement('a');a.className='card';a.href=r.link||'#';
    const poster=document.createElement('div');poster.className='poster';
    const img=document.createElement('img');img.loading='lazy';img.alt=r.title||'Anime';img.src=r.image||'';img.onerror=()=>{img.style.display='none'};poster.appendChild(img);
    const body=document.createElement('div');body.className='body';
    const title=document.createElement('div');title.className='title';title.textContent=r.title||'ไม่มีชื่อ';
    const meta=document.createElement('div');meta.className='meta';meta.textContent=[r.year,r.Show].filter(Boolean).join(' • ')+(r.id?' • #'+r.id:'');
    body.append(title,meta);a.append(poster,body);frag.appendChild(a);
  });
  grid.appendChild(frag);status.textContent=`แสดง ${list.length.toLocaleString()} รายการจากข้อมูลในโค้ด`;
}
async function load(){
  try{
    rows=await loadEmbeddedSheet2Data();
    rows=Array.isArray(rows)?rows.filter(r=>norm(r.Show)!=='true'):[];
    render();
  }catch(e){console.error(e);status.textContent='อ่านข้อมูลในโค้ดไม่สำเร็จ';grid.innerHTML='<div class="empty">ไม่สามารถอ่านข้อมูลที่ฝังไว้ได้</div>'}
}
search.addEventListener('input',render);load();
</script>
</body>
</html>
