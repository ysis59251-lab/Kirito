name: Deploy AnimeFume website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'admin-android/**'
      - 'tools/**'
      - 'database.rules.example.json'
      - 'README-SYSTEM.md'
      - 'TODO.md'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          git archive --format=tar HEAD | tar -xf - -C _site
          rm -rf _site/.git _site/.github _site/admin-android _site/tools _site/node_modules _site/Downloads _site/_site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
