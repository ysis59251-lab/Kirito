<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AnimeFume • รายการโปรด</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{background:#080808;color:#fff;font-family:system-ui,sans-serif;margin:0}
    main{max-width:1100px;margin:auto;padding:20px 16px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
    h1{font-size:24px;margin:0}.back{color:#fff;text-decoration:none;border:1px solid #444;border-radius:10px;padding:9px 13px}
    #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
    .card{position:relative;color:#fff;text-decoration:none;min-width:0}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#222}.title{display:block;margin-top:7px;font-size:14px;line-height:1.4}.remove{position:absolute;right:7px;top:7px;width:32px;height:32px;border:0;border-radius:50%;background:#111c;color:#fff;font-size:20px;cursor:pointer}.empty{color:#aaa;text-align:center;padding:60px 15px;border:1px dashed #444;border-radius:14px;grid-column:1/-1}
  </style>
</head>
<body>
  <main>
    <header><h1>รายการโปรด</h1><a class="back" href="home.html">หน้าแรก</a></header>
    <section id="list" aria-live="polite"></section>
  </main>
  <script>
    const KEY='animefume_favorites_v2';
    const list=document.getElementById('list');
    const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};
    const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
    function render(){
      const items=read(); list.replaceChildren();
      if(!items.length){const e=document.createElement('p');e.className='empty';e.textContent='ยังไม่มีรายการโปรด';list.append(e);return;}
      items.forEach((item,index)=>{
        const card=document.createElement('a');card.className='card';card.href=item.link||'#';
        const img=document.createElement('img');img.src=item.image||'';img.alt='';img.loading='lazy';
        const title=document.createElement('span');title.className='title';title.textContent=item.title||'ไม่มีชื่อ';
        const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','ลบรายการโปรด');
        remove.onclick=e=>{e.preventDefault();e.stopPropagation();const next=read();next.splice(index,1);save(next);render();};
        card.append(img,title,remove);list.append(card);
      });
    }
    render();
  </script>
</body>
</html>
