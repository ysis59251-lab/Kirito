<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeFume System Health</title><style>body{margin:0;background:#080808;color:#fff;font:16px system-ui;padding:20px}main{max-width:760px;margin:auto}section{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:10px 0}b{display:inline-block;min-width:150px}.ok{color:#55e391}.warn{color:#ffd166}</style></head><body><main><h1>AnimeFume System Health</h1><div id="out">กำลังตรวจสอบ...</div></main><script src="animefume-core.js"></script><script src="sheet2-data.js"></script><script>async function run(){const checks=[];checks.push(['Core',!!window.AnimeFume]);checks.push(['Favorites',Array.isArray(AnimeFume.getFavorites())]);checks.push(['History',Array.isArray(AnimeFume.getHistory())]);checks.push(['Embedded Sheet2',typeof window.loadEmbeddedSheet2Data==='function']);try{const d=await loadEmbeddedSheet2Data();checks.push(['Sheet2 records',Array.isArray(d)&&d.length>0]);}catch(e){checks.push(['Sheet2 records',false]);}document.getElementById('out').innerHTML=checks.map(x=>`<section><b>${x[0]}</b><span class="${x[1]?'ok':'warn'}">${x[1]?'✓ ทำงาน':'⚠ ตรวจสอบ'}</span></section>`).join('')}</script></body></html>
