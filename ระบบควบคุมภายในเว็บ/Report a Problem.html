<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Problem</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{
  min-height:100vh;
  background:#0b0d14;
  color:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
}
#bg{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 15% 10%,rgba(255,59,107,.18),transparent 35%),radial-gradient(circle at 85% 90%,rgba(124,58,237,.2),transparent 40%),#0b0d14;
  z-index:-1;
}
.report-card{
  width:92%;
  max-width:420px;
  background:#141824;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:23px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.7);
}
.report-card h1{font-size:20px;margin-bottom:6px;color:#f8fafc}
.report-card p{font-size:13px;color:#94a3b8;margin-bottom:14px}
input,textarea{
  width:100%;
  background:#0b0d14;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:#fff;
  padding:10px;
  margin-bottom:10px;
  font-size:14px;
}
input:focus,textarea:focus{outline:0;border-color:#ff3b6b;box-shadow:0 0 0 3px rgba(255,59,107,.12)}
textarea{min-height:110px;resize:none}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#ff3b6b,#7c3aed);
  color:#fff;
  font-size:15px;
  cursor:pointer;
}
button:disabled{opacity:.6}
.back{
  margin-top:10px;
  text-align:center;
  font-size:13px;
  color:#94a3b8;
  cursor:pointer;
}
.back:hover{color:#fff}
</style>
</head>

<body>
<div id="bg"></div>

<div class="report-card">
  <h1>Report a Problem</h1>
  <p>แจ้งปัญหาที่พบในการใช้งาน</p>

  <input id="page" placeholder="หน้าที่พบปัญหา (เช่น หน้า Anime / ตอนที่)">
  <textarea id="detail" placeholder="อธิบายปัญหาที่พบ..."></textarea>

  <button id="sendBtn">ส่งปัญหา</button>
  <div class="back" onclick="location.href='../home.html'">← กลับหน้าแรก</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_eG_drnzYDUSyNBapN7kJ7XaYsbkhCwA",
  authDomain: "mpmp-5864a.firebaseapp.com",
  databaseURL: "https://mpmp-5864a-default-rtdb.firebaseio.com",
  projectId: "mpmp-5864a",
  appId: "1:1071327366091:web:7867a60675ce32e3d6bd1d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const anonymousAuthReady = signInAnonymously(auth).catch((error) => {
  console.warn("Anonymous report authentication unavailable", error);
  return null;
});

const btn = document.getElementById("sendBtn");

const spamLimit = 10000; // 10 วิ
const spamKey = "lastReportTime";

btn.onclick = async () => {

  const now = Date.now();
  const last = localStorage.getItem(spamKey);

  if(last && now - last < spamLimit){
    alert("กรุณารอสักครู่ก่อนส่งอีกครั้ง");
    return;
  }

  const page = document.getElementById("page").value.trim() 
      || document.title 
      || location.pathname;

  const detail = document.getElementById("detail").value.trim();

  if(!detail){
    alert("กรุณาพิมพ์รายละเอียด");
    return;
  }

  btn.disabled = true;
  btn.textContent = "กำลังส่ง...";

  try{

    const viewer = await anonymousAuthReady;
    if(!viewer) throw new Error("ไม่สามารถยืนยันตัวตนผู้แจ้งปัญหาได้");

    const reportData = {
      page,
      detail,
      time: now,
      read:false,
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height
    };

    await set(push(ref(db,"reports/")), reportData);

    localStorage.setItem(spamKey, now);

    showSuccess();

  }catch(e){
    alert("ส่งไม่สำเร็จ");
  }

  btn.disabled = false;
  btn.textContent = "ส่งปัญหา";
};

function showSuccess(){
  const card = document.querySelector(".report-card");
  card.innerHTML = `
    <h1 style="color:#35e0c1">ส่งเรียบร้อย</h1>
    <p>ขอบคุณที่ช่วยแจ้งปัญหา</p>
    <button onclick="location.href='../home.html'"
      style="margin-top:10px;background:linear-gradient(135deg,#ff3b6b,#7c3aed);color:#fff">
      กลับหน้าแรก
    </button>
  `;
}
</script>

<script type="module" src="../animefume-realtime.js"></script>
</body>
</html>
