<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>เพิ่มตอน • AnimeFume Admin</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#20234b,#080b16 55%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(100%,520px);margin:auto;background:rgba(17,24,42,.94);border:1px solid #2b3652;border-radius:20px;padding:22px;box-shadow:0 18px 50px #0008}h1{font-size:22px;margin:0 0 5px}p{color:#a7b0c7;font-size:13px;line-height:1.55}.back{display:inline-block;color:#a7eaff;text-decoration:none;margin-bottom:18px}label{display:block;margin-top:13px;font-size:13px;color:#cbd3e7}input,select{width:100%;margin-top:6px;padding:12px 13px;border:1px solid #2d3854;border-radius:11px;background:#0b1120;color:#fff;font:inherit}input:focus,select:focus{outline:2px solid #52d9ff55;border-color:#52d9ff}.langs{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}.langs label{margin:0;display:flex;gap:7px;align-items:center}.langs input{width:auto;margin:0}.ep-row{display:flex;gap:8px}.ep-row button{width:48px;margin-top:6px;border:1px solid #34415f;background:#18243d;color:#fff;border-radius:10px;font-size:18px}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:linear-gradient(110deg,#ff4d9d,#52d9ff);color:#07111c;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin-top:13px;text-align:center;font-size:14px}.status.ok{color:#7dffbd}.status.error{color:#ff9b9b}.note{padding:10px 12px;border-radius:10px;background:#152238;color:#a7eaff}
</style></head><body><main class="box"><a class="back" href="admin.html">← กลับแดชบอร์ด</a><h1>เพิ่มตอนอนิเมะ</h1><p class="note">ข้อมูลจะถูกส่งไปยัง Google Sheets ผ่าน API เดิมของระบบ ห้ามใส่ลิงก์วิดีโอที่ยังไม่ใช้งานจริง</p><form id="form"><label>รหัสอนิเมะ<input id="anime" required placeholder="เช่น naruto"></label><label>ชื่อเรื่อง<input id="name" required placeholder="ชื่อเรื่องที่แสดงบนเว็บ"></label><label>ตอน<div class="ep-row"><button type="button" id="prev">−</button><select id="episode" required></select><button type="button" id="next">+</button></div></label><div class="langs"><label><input type="checkbox" value="พากย์ไทย"> พากย์ไทย</label><label><input type="checkbox" value="ซับไทย"> ซับไทย</label></div><label>ลิงก์วิดีโอจริง<input id="video_url" type="url" required placeholder="https://..."></label><label>เรื่องย่อ<input id="desc" placeholder="เรื่องย่อ (ถ้ามี)"></label><label>ลิงก์รูปปก<input id="cover" type="url" placeholder="https://..."></label><button class="submit" id="submit" type="submit">เพิ่มตอน</button><div id="status" class="status" role="status" aria-live="polite"></div></form></main>
<script type="module">import{requireAdmin}from"../../admin-auth.js";await requireAdmin("../Administrator.html");</script>
<script>
const API="https://script.google.com/macros/s/AKfycbxWBZkZyb5NRdMXLkBpwCX-zvDEc2BFSZFPzazKpyWsMSYlD0A7TL8GUP_Esy5MBbbNhg/exec";const $=id=>document.getElementById(id),episode=$("episode");for(let i=1;i<=120;i++){const o=document.createElement("option");o.value=i;o.textContent=`ตอนที่ ${i}`;episode.append(o)}episode.value=1;function shift(n){episode.value=Math.min(120,Math.max(1,Number(episode.value)+n))}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);const status=$('status');$('form').addEventListener('submit',async e=>{e.preventDefault();status.className='status';status.textContent='กำลังส่งข้อมูล…';$('submit').disabled=true;try{const langs=[...document.querySelectorAll('.langs input:checked')];const video=$('video_url').value.trim();if(!langs.length)throw Error('กรุณาเลือกภาษาอย่างน้อย 1 รายการ');if(!API)throw Error('ยังไม่ได้ตั้งค่า API');if(!/^https?:\/\//i.test(video))throw Error('ลิงก์วิดีโอต้องขึ้นต้นด้วย http:// หรือ https://');await Promise.all(langs.map(lang=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({anime:$('anime').value.trim(),name:$('name').value.trim(),episode:episode.value,title:lang.value,video_url:video,desc:$('desc').value.trim(),cover:$('cover').value.trim()})}).then(r=>{if(!r.ok)throw Error('เซิร์ฟเวอร์ตอบกลับ HTTP '+r.status)})));status.className='status ok';status.textContent='เพิ่มตอนสำเร็จแล้ว';$('video_url').value='';}catch(err){status.className='status error';status.textContent='เพิ่มไม่สำเร็จ: '+err.message}finally{$('submit').disabled=false}});
</script></body></html>
