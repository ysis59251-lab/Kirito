<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>AnimeFume | ดูอนิเมะออนไลน์</title>
  <link rel="stylesheet" href="anistream-main.css">
  <script src="data-source.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" type="button" onclick="switchTab('home')" aria-label="กลับหน้าแรก">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg></span>
        <span><span class="brand-name">AnimeFume <i>TH</i></span><span class="brand-sub">ANIME STREAMING</span></span>
      </button>
      <nav class="desktop-nav" aria-label="เมนูหลัก">
        <button class="nav-btn active" data-nav="home" type="button" onclick="switchTab('home')">หน้าแรก</button>
        <button class="nav-btn" data-nav="browse" type="button" onclick="switchTab('browse')">ค้นหา / หมวดหมู่</button>
        <button class="nav-btn" data-nav="mylist" type="button" onclick="switchTab('mylist')">รายการโปรด <b id="fav-badge">0</b></button>
      </nav>
      <input class="quick-search" type="search" placeholder="ค้นหาชื่ออนิเมะ..." oninput="handleHeaderSearch(this.value)" aria-label="ค้นหาชื่ออนิเมะ">
      <span class="quality">1080p ฟรีทุกเรื่อง</span>
    </div>
  </header>

  <main class="page">
    <section id="view-home" class="view active" aria-label="หน้าแรก">
      <div id="hero" class="hero"><div class="hero-copy"><div class="eyebrow">AnimeFume • กำลังโหลด</div><h1>กำลังโหลดรายการอนิเมะ...</h1></div></div>
      <section class="section"><div class="section-head"><h2 class="section-title">ดูต่อจากเดิม</h2><span id="continue-count" class="muted"></span></div><div id="continue-list" class="continue-row"></div></section>
      <section class="section"><div class="section-head"><h2 class="section-title">อนิเมะมาแรง</h2><span class="muted">อัปเดตจาก Sheet</span></div><div id="trending-grid" class="row"></div></section>
      <section class="section"><div class="section-head"><h2 class="section-title">อัปเดตล่าสุด</h2><button class="chip" type="button" onclick="switchTab('browse')">ดูทั้งหมด</button></div><div id="latest-grid" class="row"></div></section>
    </section>

    <section id="view-browse" class="view" aria-label="ค้นหาและหมวดหมู่">
      <div class="browse-panel"><h1>ค้นหาและหมวดหมู่อนิเมะ</h1><p class="muted">ค้นหาจากชื่อเรื่องภาษาไทยหรือภาษาอังกฤษ</p><input id="browse-input" class="browse-input" type="search" placeholder="พิมพ์ชื่ออนิเมะที่ต้องการค้นหา..." aria-label="ค้นหาอนิเมะ"><div class="chips"><button class="chip active" data-category="all" type="button">ทั้งหมด</button><button class="chip" data-category="sub" type="button">ซับไทย</button><button class="chip" data-category="dub" type="button">พากย์ไทย</button></div></div>
      <section class="section"><div class="section-head"><h2 class="section-title">รายการอนิเมะ</h2><span id="browse-count" class="muted"></span></div><div id="browse-grid" class="row"></div></section>
    </section>

    <section id="view-mylist" class="view" aria-label="รายการโปรด">
      <div class="mylist-panel"><h1>รายการโปรดของฉัน</h1><p class="muted">รายการนี้บันทึกไว้ในอุปกรณ์ของคุณ</p></div>
      <section class="section"><div class="section-head"><h2 class="section-title">เรื่องที่บันทึกไว้</h2><span id="mylist-count" class="muted"></span></div><div id="mylist-grid" class="row"></div></section>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="เมนูมือถือ">
    <button class="mobile-btn active" data-mobile-nav="home" type="button" onclick="switchTab('home')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>หน้าแรก</button>
    <button class="mobile-btn" data-mobile-nav="browse" type="button" onclick="switchTab('browse')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>ค้นหา</button>
    <button class="mobile-btn" data-mobile-nav="mylist" type="button" onclick="switchTab('mylist')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a2 2 0 0 1 2 2v16l-7-3.5L6 21V5a2 2 0 0 1 2-2z"/></svg>รายการโปรด</button>
  </nav>
  <script src="anistream-app.js"></script>
</body>
</html>
