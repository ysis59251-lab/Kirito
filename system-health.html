<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeFume System Health</title><style>body{margin:0;background:#080808;color:#fff;font:16px system-ui;padding:20px}main{max-width:760px;margin:auto}section{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:10px 0}b{display:inline-block;min-width:150px}.ok{color:#55e391}.warn{color:#ffd166}</style></head><body><main><h1>AnimeFume System Health</h1><div id="out">กำลังตรวจสอบ...</div></main><script src="animefume-core.js"></script><script src="sheet2-data.js"></script><script>
async function run(){
  const checks=[];
  checks.push(['Core',!!window.AnimeFume]);
  checks.push(['Favorites',!!window.AnimeFume&&Array.isArray(AnimeFume.getFavorites())]);
  checks.push(['History',!!window.AnimeFume&&Array.isArray(AnimeFume.getHistory())]);
  checks.push(['Storage',(()=>{try{const k='af_health_'+Date.now();localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch{return false}})()]);
  checks.push(['Embedded Sheet2',typeof window.loadEmbeddedSheet2Data==='function']);
  try{
    const d=await loadEmbeddedSheet2Data();
    checks.push(['Sheet2 records',Array.isArray(d)&&d.length>0]);
  }catch(e){
    checks.push(['Sheet2 records',false]);
  }
  const out=document.getElementById('out');
  out.innerHTML='';
  checks.forEach(([name,ok])=>{
    const section=document.createElement('section');
    const b=document.createElement('b');
    b.textContent=name;
    const span=document.createElement('span');
    span.className=ok?'ok':'warn';
    span.textContent=ok?'✓ ทำงาน':'⚠ ตรวจสอบ';
    section.append(b,span);
    out.appendChild(section);
  });
}
run();
</script></body></html>
